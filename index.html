<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Job To-Do List</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<button id="modeToggleBtn"><i class="fas fa-sun"></i></button>

<div class="container">
  <h1>Job To-Do List</h1>

  <div class="input-grid">
    <input type="text" id="companyInput" placeholder="Company...">
    <input type="text" id="roleInput" placeholder="Role...">
    <select id="categorySelect">
      <option value="applied">Applied</option>
      <option value="interview">Interview</option>
      <option value="offer">Offer</option>
      <option value="rejected">Rejected</option>
    </select>
    <select id="prioritySelect">
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
    </select>
    <input type="date" id="deadlineInput">
  </div>

  <div class="filter-buttons">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="applied">Applied</button>
    <button class="filter-btn" data-filter="interview">Interview</button>
    <button class="filter-btn" data-filter="offer">Offer</button>
    <button class="filter-btn" data-filter="rejected">Rejected</button>
  </div>

  <div class="sort-bar">
    <label for="sortSelect">Sort by:</label>
    <select id="sortSelect">
      <option value="none">—</option>
      <option value="priority">Priority</option>
      <option value="deadline">Deadline</option>
    </select>
  </div>

  <ul id="taskList"></ul>
  <div id="taskCounter">Total tasks: 0 | Completed: 0 | Pending: 0</div>

  <div class="bottom-buttons">
    <button id="addBtn">✔ Add Task</button>
    <button id="clearBtn">✖ Delete All</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
